worker_processes 1;
pid "__RUNTIME__/nginx/nginx.pid";
error_log "__RUNTIME__/nginx/error.log" warn;
events { worker_connections 256; }
http {
    include "__MIME__";
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path "__RUNTIME__/nginx/client_temp";
    proxy_temp_path "__RUNTIME__/nginx/proxy_temp";
    server {
        listen 127.0.0.1:__ADMIN__;
        root "__RUNTIME__/current/admin";
        index index.html;
        location /api/ {
            proxy_pass http://127.0.0.1:__BACKEND__;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }
    server {
        listen 127.0.0.1:__H5__;
        root "__RUNTIME__/current/h5";
        index index.html;
        location /api/ {
            proxy_pass http://127.0.0.1:__BACKEND__;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    }
}
